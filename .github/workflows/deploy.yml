# Build the lecture-note site with Jupyter Book and publish it to GitHub Pages.
# Runs on every push to main (and can be started by hand from the Actions tab).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy lecture notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site is served from https://<user>.github.io/<repository-name>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Jupyter Book
        run: pip install -r requirements.txt
      - name: Build the site
        run: jupyter-book build --html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
